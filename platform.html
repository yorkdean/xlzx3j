<style>
  :root {
    --primary: #0ea5e9;
    --primary-light: #e0f2fe;
    --primary-dark: #0369a1;
    --accent: #7c3aed;
    --accent-light: #ede9fe;
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warning: #d97706;
    --warning-light: #fef3c7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; font-size: 15px;
  }
  .header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));

  }

  .layout { display: flex; align-items: flex-start; }
  .sidebar {
    width: 280px; min-width: 280px; height: calc(100vh - 70px); overflow-y: auto;
    background: var(--card-bg); border-right: 1px solid var(--border); padding: 12px;
    position: sticky; top: 70px;
  }
  .sidebar h3 { font-size: 13px; color: var(--text-muted); margin: 10px 8px 6px; }
  .bank-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; transition: all 0.15s; display:flex; justify-content:space-between; align-items:center;
  }
  .bank-item:hover { background: var(--primary-light); }
  .bank-item.active { background: var(--primary); color:#fff; }
  .bank-item .bn { font-size: 13px; font-weight: 500; }
  .bank-item .bc { font-size: 11px; opacity:0.8; }
  .bank-item.active .bc { color:#e0f2fe; }
  .main { flex: 1; padding: 20px 28px; min-width: 0; }
  .main-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .main-head h2 { font-size: 18px; }
  .main-head .meta { font-size: 13px; color: var(--text-muted); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; }
  .tbtn {
    padding: 6px 14px; border:1px solid var(--border); border-radius:8px; background:#fff; cursor:pointer;
    font-size:13px; font-weight:500; transition:all .15s;
  }
  .tbtn:hover { background: var(--primary-light); }
  .tbtn.primary { background: var(--primary); color:#fff; border-color:var(--primary); }
  .q-card {
    background: var(--card-bg); border:1px solid var(--border); border-radius:12px;
    padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .q-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .q-num { font-size:14px; font-weight:700; color:var(--primary-dark); }
  .q-type { font-size:11px; padding:2px 8px; border-radius:4px; background:var(--accent-light); color:var(--accent); font-weight:600; }
  .q-diff { font-size:11px; color:var(--text-muted); margin-left:auto; }
  .q-stem { font-size:15px; font-weight:500; margin-bottom:12px; white-space:pre-wrap; }
  .opt { display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer; transition:all .15s; }
  .opt:hover { background: var(--primary-light); }
  .opt .lab { font-weight:700; color:var(--primary-dark); min-width:18px; }
  .opt .txt { flex:1; }
  .opt.sel { background: var(--primary-light); border-color: var(--primary); }
  .opt.correct { background: var(--success-light); border-color: var(--success); }
  .opt.correct .lab { color: var(--success); }
  .opt.wrong { background: var(--danger-light); border-color: var(--danger); }
  .opt.wrong .lab { color: var(--danger); }
  .reveal-btn {
    margin-top:6px; padding:6px 16px; border:none; border-radius:8px; background:var(--primary); color:#fff;
    font-size:13px; cursor:pointer; font-weight:500;
  }
  .reveal-btn:hover { background: var(--primary-dark); }
  .answer-box { margin-top:12px; padding:12px 14px; background: var(--bg); border-radius:8px; display:none; }
  .answer-box.show { display:block; }
  .answer-line { font-size:14px; font-weight:600; margin-bottom:6px; }
  .answer-line .a-val { color: var(--success); }
  .analysis { font-size:13.5px; color: var(--text); white-space:pre-wrap; line-height:1.8; }
  .no-ans { font-size:13px; color: var(--warning); }
  .progress-wrap { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0 0; }
  .progress-bar { height:100%; background:var(--primary); width:0; transition:width .3s; }
  @media (max-width: 768px) {
    .sidebar { display:none; }
    .main { padding:14px; }
  }
</style>

<script>
const BANKS = [{"name": "（基础理论）心理学导论", "qs": [{"n": 1, "type": "单选", "stem": "心理学研究内容不包括（    ）。", "opts": [{"n": "A", "t": "心理现象"}, {"n": "B", "t": "心理活动发生、发展的生理基础和机制"}, {"n": "C", "t": "人类的生理结构"}, {"n": "D", "t": "制约心理现象的因素"}], "answer": "C", "analysis": "解析：文章提到心理学研究内容包括心理现象、心理活动发生发展的生理基础、制约心理现象的因素，但不包括人类的生理结构。出处：P3～4", "diff": 2}, {"n": 2, "type": "单选", "stem": "心理活动的生理基础是（    ）", "opts": [{"n": "A", "t": "脑是心理活动的器官"}, {"n": "B", "t": "心脏是心理活动的器官"}, {"n": "C", "t": "肝脏是心理活动的器官"}, {"n": "D", "t": "肺是心理活动的器官"}], "answer": "A", "analysis": "解析：文章明确指出\"心理是脑的机能，脑是心理活动的器官，心理活动依赖脑的生理活动。\"出处：P3", "diff": 2}, {"n": 3, "type": "单选", "stem": "传统上，心理现象被分解为（    ）。", "opts": [{"n": "A", "t": "心理过程和个性心理"}, {"n": "B", "t": "心理过程和认知过程"}, {"n": "C", "t": "认知过程和情绪情感过程"}, {"n": "D", "t": "情绪情感过程和意志过程"}], "answer": "A", "analysis": "解析：文章指出\"传统的二分法，把心理现象分解为心理过程和个性心理。\"出处：P4", "diff": 2}, {"n": 4, "type": "单选", "stem": "心理过程主要指（    ）。", "opts": [{"n": "A", "t": "认知过程、情绪情感过程和意志过程"}, {"n": "B", "t": "个性倾向性和个性心理特征"}, {"n": "C", "t": "需要、情绪情感和动机"}, {"n": "D", "t": "元认知和意志过程"}], "answer": "A", "analysis": "解析：文章指出\"心理过程主要指认知过程、情绪情感过程和意志过程，关注人们进行心理活动时所遵循的共同规律\"出处：P4", "diff": 2}, {"n": 5, "type": "单选", "stem": "个性心理主要包括（    ）。", "opts": [{"n": "A", "t": "个性倾向性和个性心理特征"}, {"n": "B", "t": "个性倾向性和认知过程"}, {"n": "C", "t": "个性心理特征和情绪情感过程"}, {"n": "D", "t": "情绪情感过程和意志过程"}], "answer": "A", "analysis": "解析：文章指出\"个性心理主要包括个性倾向性和个性心理特征，关注人们进行心理活动时表现出来的特殊性\"出处：P4", "diff": 2}, {"n": 6, "type": "单选", "stem": "<p>心理活动的反应过程不包括（ ）。</p>", "opts": [{"n": "A", "t": "知觉"}, {"n": "B", "t": "思维"}, {"n": "C", "t": "意志 "}, {"n": "D", "t": "记忆"}], "answer": "C", "analysis": "<p>解析：文章指出“心理活动的反应过程，就是认知过程。认知是指人们获得理论知识或应用知识的过程，也称为信息加工的过程，是人的最基本的心理过程。它包括感知觉、记忆、思维（以及想象）等认知形式。”\"出处：P4～5</p>", "diff": 2}, {"n": 7, "type": "单选", "stem": "认知过程不包括（    ）。", "opts": [{"n": "A", "t": "感知觉"}, {"n": "B", "t": "记忆"}, {"n": "C", "t": "思维"}, {"n": "D", "t": "动机"}], "answer": "D", "analysis": "解析：文章指出\"认知过程包括感知觉、记忆、思维（以及想象）等认知形式。\"出处：P4～5", "diff": 2}, {"n": 8, "type": "单选", "stem": "感知觉的定义是（    ）。", "opts": [{"n": "A", "t": "人脑对事物外在特征的直接反映"}, {"n": "B", "t": "人脑对事物内在特征的直接反映"}, {"n": "C", "t": "人脑对事物整体的反映"}, {"n": "D", "t": "人脑对事物抽象特征的反映"}], "answer": "A", "analysis": "解析：文章指出\"感知觉是人脑对事物外在特征的直接反映，属于感性认识阶段。出处：P5", "diff": 2}, {"n": 9, "type": "单选", "stem": "记忆是（    ）。", "opts": [{"n": "A", "t": "人们通过感知觉所获得的知识经验，在刺激物停止作用后，并没有马上全部消失，有些信息还保留在人们的头脑中，并在需要时再现出来"}, {"n": "B", "t": "人脑对事物外在特征的直接反映"}, {"n": "C", "t": "人脑对事物整体的反映"}, {"n": "D", "t": "人脑对事物抽象特征的反映"}], "answer": "A", "analysis": "解析：文章指出\"人们通过感知觉所获得的知识经验，在刺激物停止作用后，并没有马上全部消失，有些信息还保留在人们的头脑中，并在需要时再现出来。这种积累和保存个体经验的心理过程称作记忆\"出处：P5", "diff": 2}, {"n": 10, "type": "单选", "stem": "思维是（    ）。", "opts": [{"n": "A", "t": "人不仅能直接感知个别、具体的事物，认识事物的表面特征和关系，还能运用头脑中已有的知识和经验去间接、概括地认识事物，揭露事物的本质及其内在的联系和规律"}, {"n": "B", "t": "人脑对事物外在特征的直接反映"}, {"n": "C", "t": "人脑对事物整体的反映"}, {"n": "D", "t": "人脑对事物抽象特征的反映"}], "answer": "A", "analysis": "解析：文章指出\"人不仅能直接感知个别、具体的事物，认识事物的表面特征和关系，还能运用头脑中已有的知识和经验去间接、概括地认识事物，揭露事物的本质及其内在的联系和规律，形成对事物的概念、判断和推理，解决面临的各种问题，这就是思维。\"出处：P5", "diff": 2}, {"n": 11, "type": "单选", "stem": "想象是（    ）。", "opts": [{"n": "A", "t": "人脑对事物外在特征的直接反映"}, {"n": "B", "t": "人脑对事物整体的反映"}, {"n": "C", "t": "人脑对事物抽象特征的反映"}, {"n": "D", "t": "思维的过程和结果如果都是形象的，就被称为想象"}], "answer": "D", "analysis": "解析：文章指出\"思维的过程和结果如果都是形象的，就被称为想象。想象是一种特殊的思维方式。\"出处：P5", "diff": 2}, {"n": 12, "type": "单选", "stem": "神经元的结构包括（    ）。", "opts": [{"n": "A", "t": "胞体、树突和轴突"}, {"n": "B", "t": "胞体、树突和突触"}, {"n": "C", "t": "树突、轴突和神经胶质细胞"}, {"n": "D", "t": "胞体、轴突和神经胶质细胞"}], "answer": "A", "analysis": "解析：文章指出\"神经元是神经系统的基本单位，由胞体、树突和轴突组成\"出处：P7", "diff": 2}, {"n": 13, "type": "单选", "stem": "神经胶质细胞的主要功能是（    ）。", "opts": [{"n": "A", "t": "引导神经元生长发育，为未成熟的神经元提供支持，并在脑细胞受到损伤时协助其恢复"}, {"n": "B", "t": "传递神经冲动"}, {"n": "C", "t": "产生神经递质"}, {"n": "D", "t": "形成髓鞘，使神经冲动快速精准传递"}], "answer": "A", "analysis": "解析：文章指出\"神经胶质细胞数量庞大，为神经元提供支持。它们引导神经元生长发育，为未成熟的神经元提供支持，并在脑细胞受到损伤时协助其恢复。胶质细胞还能形成髓鞘，使神经冲动快速精准传递，髓鞘化是神经系统成熟的标志。\"出 const typeIsMulti = (t) => (t === '多选' || t === '不定项');
function ansSet(a){ return (a||'').split('').filter(c=>/[A-Z]/.test(c)); }

let curBank = null;
let showAll = false;

const sidebarT = document.getElementById('theory-banks');
const sidebarM = document.getElementById('mock-banks');
function bankEl(b, idx){
  const div = document.createElement('div');
  div.className = 'bank-item';
  div.dataset.idx = idx;
  const answered = b.qs.filter(q=>q.answer).length;
  div.innerHTML = `<span class="bn">${b.name.replace(/（.*?）/g,'').replace(/（四级\)$/,'')}</span><span class="bc">${answered}/${b.qs.length}</span>`;
  div.onclick = () => selectBank(idx);
  return div;
}
BANKS.forEach((b,i)=>{
  // theory vs mock
  const isMock = /模拟卷/.test(b.name);
  (isMock?sidebarM:sidebarT).appendChild(bankEl(b,i));
});

function selectBank(idx){
  curBank = idx;
  document.querySelectorAll('.bank-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.idx == idx);
  });
  render(idx);
}

function render(idx){
  const b = BANKS[idx];
  document.getElementById('cur-title').textContent = b.name;
  const answered = b.qs.filter(q=>q.answer).length;
  const withAn = b.qs.filter(q=>q.analysis).length;
  document.getElementById('cur-meta').textContent = `共 ${b.qs.length} 题 · 有答案 ${answered} · 有解析 ${withAn}`;
  const list = document.getElementById('qlist');
  list.innerHTML = '';
  b.qs.forEach((q, qi)=>{
    const card = document.createElement('div');
    card.className = 'q-card';
    const set = ansSet(q.answer);
    const multi = typeIsMulti(q.type);
    let optsHtml = '';
    q.opts.forEach(o=>{
      optsHtml += `<div class="opt" data-opt="${o.n}"><span class="lab">${o.n}.</span><span class="txt">${escapeHtml(o.t)}</span></div>`;
    });
    const diffStars = q.diff ? '难度 '+ '★'.repeat(Math.min(q.diff,5)) : '';
    card.innerHTML = `
      <div class="q-head">
        <span class="q-num">${q.n}.</span>
        <span class="q-type">${q.type}</span>
        ${diffStars?`<span class="q-diff">${diffStars}</span>`:''}
      </div>
      <div class="q-stem">${escapeHtml(q.stem)}</div>
      <div class="opts">${optsHtml}</div>
      <button class="reveal-btn">显示答案与解析</button>
      <div class="answer-box">
        ${q.answer ? `<div class="answer-line">正确答案：<span class="a-val">${q.answer}</span></div>` : `<div class="no-ans">本题官方答案暂未抓取，可先自测。</div>`}
        ${q.analysis ? `<div class="analysis">${escapeHtml(q.analysis)}</div>` : (q.answer?`<div class="no-ans">（暂无官方解析）</div>`:'')}
      </div>
    `;
    // option click (self-test)
    const optEls = card.querySelectorAll('.opt');
    optEls.forEach(oe=>{
      oe.onclick = ()=>{
        if(card.querySelector('.answer-box').classList.contains('show')) return; // locked after reveal
        if(multi){
          oe.classList.toggle('sel');
        } else {
          optEls.forEach(x=>x.classList.remove('sel'));
          oe.classList.add('sel');
        }
      };
    });
    const btn = card.querySelector('.reveal-btn');
    const box = card.querySelector('.answer-box');
    btn.onclick = ()=>{
      box.classList.toggle('show');
      if(box.classList.contains('show')){
        btn.textContent = '隐藏答案与解析';
        // mark correctness
        const sel = card.querySelectorAll('.opt.sel');
        const selSet = Array.from(sel).map(e=>e.dataset.opt).sort().join('');
        const corr = set.slice().sort().join('');
        optEls.forEach(oe=>{
          const on = oe.dataset.opt;
          if(set.includes(on)) oe.classList.add('correct');
        });
        if(sel.length){
          if(selSet === corr){
            // all good
          } else {
            sel.forEach(e=>{ if(!set.includes(e.dataset.opt)) e.classList.add('wrong'); });
          }
        }
      } else {
        btn.textContent = '显示答案与解析';
      }
    };
    if(showAll){
      box.classList.add('show');
      optEls.forEach(oe=>{ if(set.includes(oe.dataset.opt)) oe.classList.add('correct'); });
      btn.textContent='隐藏答案与解析';
    }
    list.appendChild(card);
  });
  updateProgress(b);
  window.scrollTo(0,0);
}

function updateProgress(b){
  const pct = b.qs.length? (b.qs.filter(q=>q.answer).length/b.qs.length*100):0;
  document.getElementById('pbar').style.width = pct+'%';
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('toggle-all').onclick = ()=>{
  showAll = !showAll;
  document.getElementById('toggle-all').textContent = showAll? '全部隐藏答案':'全部显示答案';
  if(curBank!==null) render(curBank);
};
document.getElementById('scroll-top').onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});

// default: select first bank
selectBank(0);
</script>
